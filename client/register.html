<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register</title>
<link rel="icon" href="images/banner/favicon.jpg" type="image/png">

<link rel="stylesheet" href="css/register.css">

</head>


<body>
    
<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="auth-left">
        <div class="brand">
            <h1>YKB CLOTHING</h1>
            <p>Create your account and discover premium streetwear, exclusive drops, and member-only offers.</p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="auth-right">

        <div class="logo">
            <ion-icon name="person-add-outline"></ion-icon>
        </div>

        <h2>Create Account</h2>

        <p class="subtitle">
            Join YKB Clothing and start shopping today
        </p>

        <form id="registerForm" autocomplete="off">

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="person-outline"></ion-icon>
                </span>

                <input
                    id="username"
                    type="text"
                    placeholder=" "
                    required>

                <label>Full Name</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </span>

                <input
                    id="email"
                    type="email"
                    placeholder=" "
                    required>

                <label>Email</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                </span>

                <input
                    id="password"
                    type="password"
                    placeholder=" "
                    required>

                <label>Password</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="shield-checkmark-outline"></ion-icon>
                </span>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder=" "
                    required>

                <label>Confirm Password</label>

            </div>

            <button type="submit" id="registerBtn">
                Create Account
            </button>

            <div class="register-link">

                <p>
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>

            </div>

        </form>

    </div>

</div>

<!-- Ion Icons -->
<script type="module"
    src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js">
</script>
<script src="js/config.js"></script>
<script src="js/register.js"></script>



</body>

</html>
