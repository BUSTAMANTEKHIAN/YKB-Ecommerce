<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/newsletter.css">
</head>

<body>

    
<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="auth-left">
        <div class="brand">
            <h1>YKB CLOTHING</h1>
            <p>Premium streetwear and timeless essentials for modern fashion.</p>
            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="auth-right">

        <div class="logo">
            <ion-icon name="bag-outline"></ion-icon>
        </div>

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Sign in to continue shopping
        </p>

        <form id="loginForm" autocomplete="off">

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </span>

                <input
                    id="email"
                    type="email"
                    placeholder=" "
                    required>

                <label>Email</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                </span>

                <input
                    id="password"
                    type="password"
                    placeholder=" "
                    required>

                <label>Password</label>

            </div>

            <div class="remember-forgot">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="forgot.html">Forgot Password?</a>

            </div>

            <button type="submit" id="loginBtn">
                Sign In
            </button>

            <div class="register-link">

                <p>
                    Don't have an account?
                    <a href="register.html">Create one</a>
                </p>

            </div>

        </form>

    </div>

</div>

<!-- Ion Icons -->
<script type="module"
    src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js">
</script>

<script src="js/config.js"></script>
<script src="js/login.js"></script>



<section id="newsletter" class="section-p1 section-m1" aria-labelledby="site-newsletter-heading">
  <div class="newstext">
    <h4 id="site-newsletter-heading">Sign Up For Newsletter</h4>
    <p>Get E-mail updates about our latest shop and <span>special offers.</span></p>
  </div>
  <form class="form site-newsletter-form" novalidate>
    <div class="newsletter-field">
      <label class="sr-only" for="site-newsletter-email">Email address</label>
      <input type="email" id="site-newsletter-email" placeholder="Your Email Address" autocomplete="email" required>
      <span class="field-error" role="status" aria-live="polite"></span>
    </div>
    <button class="normal" type="submit"><span class="btn-label">Sign Up</span></button>
  </form>
</section>

<script src="js/newsletter.js"></script>
</body>
</html>
