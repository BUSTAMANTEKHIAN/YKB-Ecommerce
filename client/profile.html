<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="layout">

    <div class="sidebar">

    <div class="sidebar-brand">
        <h2>YKB</h2>
        <span>MY ACCOUNT</span>
    </div>

    <nav class="profile-nav">

        <a href="index.html">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>

        <a class="active" href="profile.html">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>

        <a href="orders.html">
            <i class="fas fa-box"></i>
            <span>Orders</span>
        </a>

        <a href="wishlist.html">
            <i class="fas fa-heart"></i>
            <span>Wishlist</span>
        </a>

    </nav>

    <div class="sidebar-bottom">

        <button type="button" onclick="logout()" class="logout">
            <i class="fas fa-right-from-bracket"></i>
            <span>Exit / Logout</span>
        </button>

    </div>

</div>

    <!-- MAIN -->
    <div class="main">

        <!-- HEADER CARD -->
        <div class="header-card">

            <div class="banner"></div>

            <div class="profile-section">

                <div class="avatar-wrapper">
                    <img id="profile-image" src="images/default-user.png" alt="Profile photo">
                    <label class="camera">
                        <i class="fas fa-camera"></i>
                        <input type="file" id="upload-image" accept="image/*" hidden>
                    </label>
                </div>

                <div class="info">
                    <h2 id="profile-name"></h2>
                    <p id="profile-email"></p>

                    <button id="editBtn">
                        <i class="fas fa-pen"></i> Edit Profile
                    </button>
                </div>

            </div>
        </div>

        <!-- STATS -->
        <div class="stats">

            <div class="card">
                <h3 id="orderCount">—</h3>
                <p>Orders</p>
            </div>

            <div class="card">
                <h3 id="totalSpent">—</h3>
                <p>Total Spent</p>
            </div>

            <div class="card">
                <h3>Active</h3>
                <p>Status</p>
            </div>

        </div>

    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">

    <div class="modal-box">
        <h3>Edit Profile</h3>

        <div class="field">
            <input type="text" id="edit-name" placeholder="Full name">
            <span class="field-error" id="edit-name-error"></span>
        </div>

        <div class="field">
            <input type="email" id="edit-email" placeholder="Email address">
            <span class="field-error" id="edit-email-error"></span>
        </div>

        <div class="modal-actions">
            <button class="save-btn" id="saveProfileBtn" onclick="saveProfile()">Save</button>
            <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

</div>

<!-- Toast notifications -->
<div id="toast-stack" class="toast-stack" aria-live="polite"></div>


<script src="js/config.js"></script>
<script src="js/profile.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
