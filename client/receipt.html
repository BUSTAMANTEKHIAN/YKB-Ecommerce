<!DOCTYPE html>
<html>
<head>
    <title>Receipt | YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="stylesheet" href="css/receipt.css">
    <link rel="stylesheet" href="css/newsletter.css">
</head>
<body>

<div class="receipt-container">

    <div class="receipt-header">
        <img src="images/banner/b1.png" class="receipt-logo">
        <h1>Ordered Successful 🎉</h1>
        <p>Thank you for shopping with YKB Clothing.</p>
        <p class="thank-you">
            We appreciate your order and hope you enjoy your purchase!
        </p>
    </div>

    <div id="receipt-content"></div>

    <div class="receipt-actions">
        <button onclick="window.print()">
            🖨 Print Receipt
        </button>

        <button onclick="window.location.href='index.html'">
            🛍 Continue Shopping
        </button>
    </div>

</div>
<script src="js/config.js"></script>
<script src="js/receipt.js"></script>

<section id="newsletter" class="section-p1 section-m1" aria-labelledby="site-newsletter-heading">
  <div class="newstext">
    <h4 id="site-newsletter-heading">Sign Up For Newsletter</h4>
    <p>Get E-mail updates about our latest shop and <span>special offers.</span></p>
  </div>
  <form class="form site-newsletter-form" novalidate>
    <div class="newsletter-field">
      <label class="sr-only" for="site-newsletter-email">Email address</label>
      <input type="email" id="site-newsletter-email" placeholder="Your Email Address" autocomplete="email" required>
      <span class="field-error" role="status" aria-live="polite"></span>
    </div>
    <button class="normal" type="submit"><span class="btn-label">Sign Up</span></button>
  </form>
</section>

<script src="js/newsletter.js"></script>
</body>
</html>
