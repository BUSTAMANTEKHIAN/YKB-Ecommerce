<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - YKB Clothing</title>
    <link rel="icon" href="images\banner\favicon.jpg" type="image/png">
    <link rel="stylesheet" href="css/forgot.css">
</head>
<body>

```
<div class="auth-container">

    <!-- LEFT SIDE -->
    <div class="auth-left">
        <div class="brand">
            <h1>YKB CLOTHING</h1>
            <p>Recover your account securely and get back to shopping premium streetwear and timeless essentials.</p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="auth-right">

        <div class="logo">
            <ion-icon name="key-outline"></ion-icon>
        </div>

        <h2>Forgot Password</h2>

        <p class="subtitle">
            Enter the email address associated with your account and we'll send you a password reset link.
        </p>

        <form id="forgotForm" autocomplete="off">

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="mail-outline"></ion-icon>
                </span>

                <input
                    id="email"
                    type="email"
                    placeholder=" "
                    required>

                <label>Email</label>

            </div>

            <button type="submit" id="resetBtn">
                Send Reset Link
            </button>

            <div class="register-link">

                <p>
                    Remember your password?
                    <a href="login.html">Back to Sign In</a>
                </p>

            </div>

        </form>

    </div>

</div>

<!-- Ion Icons -->
<script type="module"
    src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js">
</script>

<script src="js/config.js"></script>
<script src="js/forgot.js"></script>
```

</body>
</html>
