<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/order-success.css">
</head>
<body>

<section class="success-page show">

    <div class="success-card">

        <div class="checkmark">
            <i class="fa-solid fa-check"></i>
        </div>

        <span class="success-eyebrow">Order confirmed</span>
        <h1>Thank You For Your Order!</h1>

        <p class="message">
            Your order has been placed successfully and is now being processed.
        </p>

        <div class="order-info">
            <p>Order Number</p>
            <h2 id="order-number">—</h2>
            <div class="order-info__meta">
                <span id="order-date"></span>
                <span id="order-total"></span>
            </div>
        </div>

        <div id="order-items" class="order-items">
            <!-- items render here, if available -->
        </div>

        <div class="buttons">
            <a href="orders.html">
                <button class="normal">
                    View My Orders
                </button>
            </a>

            <a href="shop.html">
                <button class="shopping-btn">
                    Continue Shopping
                </button>
            </a>
        </div>

    </div>

</section>

<script src="js/config.js"></script>
<script src="js/order-success.js"></script>
</body>
</html>
