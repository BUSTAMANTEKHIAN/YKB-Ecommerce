<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/forgot.css">
    <link rel="stylesheet" href="css/newsletter.css">
</head>
<body>

<div id="toast-stack" class="toast-stack" aria-live="polite"></div>

<div class="auth-container">

    <div class="auth-left">
        <div class="brand">
            <h1>YKB CLOTHING</h1>
            <p>Choose a new password to secure your account and continue shopping.</p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <div class="auth-right">

        <div class="logo">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Enter your new password below. Must be at least 8 characters with a letter and a number.
        </p>

        <form id="resetForm" autocomplete="off" novalidate>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                </span>

                <input
                    id="password"
                    type="password"
                    minlength="8"
                    placeholder=" "
                    required>

                <label for="password">New Password</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="shield-checkmark-outline"></ion-icon>
                </span>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder=" "
                    required>

                <label for="confirmPassword">Confirm Password</label>

            </div>

            <button type="submit" id="saveBtn">
                Update Password
            </button>

            <div class="register-link" style="margin-top: 16px;">
                <p>
                    <a href="login.html">Back to Sign In</a>
                </p>
            </div>

        </form>

    </div>

</div>

<script type="module" src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js"></script>

<script src="js/config.js"></script>
<script src="js/reset-password.js"></script>

<script src="js/newsletter.js"></script>
</body>
</html>
