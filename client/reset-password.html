<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="stylesheet" href="css/forgot.css">
</head>
<body>

```
<div class="auth-container">

    <div class="auth-left">
        <div class="brand">
            <h1>YKB CLOTHING</h1>
            <p>Choose a new password to secure your account and continue shopping.</p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <div class="auth-right">

        <div class="logo">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Enter your new password below.
        </p>

        <form id="resetForm" autocomplete="off">

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                </span>

                <input
                    id="password"
                    type="password"
                    placeholder=" "
                    required>

                <label>New Password</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="shield-checkmark-outline"></ion-icon>
                </span>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder=" "
                    required>

                <label>Confirm Password</label>

            </div>

            <button type="submit" id="saveBtn">
                Update Password
            </button>

        </form>

    </div>

</div>

<script type="module"
    src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js">
</script>

<script src="js/config.js"></script>
<script src="js/reset-password.js"></script>
```

</body>
</html>
