<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="stylesheet" href="css/forgot.css">
    <link rel="stylesheet" href="css/newsletter.css">
</head>
<body>

```
<div class="auth-container">

    <div class="auth-left">
        <div class="brand">
            <h1>YKB CLOTHING</h1>
            <p>Choose a new password to secure your account and continue shopping.</p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>
        </div>
    </div>

    <div class="auth-right">

        <div class="logo">
            <ion-icon name="shield-checkmark-outline"></ion-icon>
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Enter your new password below.
        </p>

        <form id="resetForm" autocomplete="off">

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                </span>

                <input
                    id="password"
                    type="password"
                    minlength="8"
                    placeholder=" "
                    required>

                <label>New Password</label>

            </div>

            <div class="input-box">

                <span class="icon">
                    <ion-icon name="shield-checkmark-outline"></ion-icon>
                </span>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder=" "
                    required>

                <label>Confirm Password</label>

            </div>

            <button type="submit" id="saveBtn">
                Update Password
            </button>

        </form>

    </div>

</div>

<script type="module"
    src="https://unpkg.com/ionicons@7.2.1/dist/ionicons/ionicons.esm.js">
</script>

<script src="js/config.js"></script>
<script src="js/reset-password.js"></script>
```


<section id="newsletter" class="section-p1 section-m1" aria-labelledby="site-newsletter-heading">
  <div class="newstext">
    <h4 id="site-newsletter-heading">Sign Up For Newsletter</h4>
    <p>Get E-mail updates about our latest shop and <span>special offers.</span></p>
  </div>
  <form class="form site-newsletter-form" novalidate>
    <div class="newsletter-field">
      <label class="sr-only" for="site-newsletter-email">Email address</label>
      <input type="email" id="site-newsletter-email" placeholder="Your Email Address" autocomplete="email" required>
      <span class="field-error" role="status" aria-live="polite"></span>
    </div>
    <button class="normal" type="submit"><span class="btn-label">Sign Up</span></button>
  </form>
</section>

<script src="js/newsletter.js"></script>
</body>
</html>
