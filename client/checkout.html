<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Checkout — YKB Clothing</title>
    <link rel="icon" href="images/banner/favicon.jpg" type="image/png">
    <link rel="stylesheet" href="css/checkout.css">
</head>
<body>

    <!-- ===== Minimal top bar ===== -->
    <header class="site-bar">
        <a href="index.html" class="site-bar__mark">YKB</a>
        <a href="cart.html" class="site-bar__back">
            <i class="fa-solid fa-arrow-left-long"></i> Back to cart
        </a>
    </header>

    <main class="checkout-container">

        <!-- ===== Left: shipping + payment ===== -->
        <section class="checkout-left">

            <span class="checkout-eyebrow">Step into checkout</span>
            <h1>Shipping Details</h1>
            <p class="checkout-sub">Tell us where the order should land.</p>

            <form id="checkout-form" novalidate>

                <div class="field">
                    <input type="text" id="fullName" name="fullName" placeholder=" " autocomplete="name" required>
                    <label for="fullName">Full name</label>
                    <span class="field-error" data-error-for="fullName"></span>
                </div>

                <div class="field">
                    <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
                    <label for="email">Email address</label>
                    <span class="field-error" data-error-for="email"></span>
                </div>

                <div class="field">
                    <input type="tel" id="phone" name="phone" placeholder=" " autocomplete="tel" required>
                    <label for="phone">Phone number</label>
                    <span class="field-error" data-error-for="phone"></span>
                </div>

                <div class="field">
                    <input type="text" id="address" name="address" placeholder=" " autocomplete="street-address" required>
                    <label for="address">Street address</label>
                    <span class="field-error" data-error-for="address"></span>
                </div>

                <div class="row">
                    <div class="field">
                        <input type="text" id="city" name="city" placeholder=" " autocomplete="address-level2" required>
                        <label for="city">City</label>
                        <span class="field-error" data-error-for="city"></span>
                    </div>

                    <div class="field">
                        <input type="text" id="postalCode" name="postalCode" placeholder=" " autocomplete="postal-code" required>
                        <label for="postalCode">Postal code</label>
                        <span class="field-error" data-error-for="postalCode"></span>
                    </div>
                </div>

                <h3 class="section-label">Payment Method</h3>

                <div class="payment-method" role="radiogroup" aria-label="Payment method">

                    <label class="pay-option">
                        <input type="radio" name="payment" value="COD" checked>
                        <span class="pay-option__icon"><i class="fa-solid fa-money-bill-wave"></i></span>
                        <span class="pay-option__text">
                            <strong>Cash on Delivery</strong>
                            <small>Pay when your order arrives</small>
                        </span>
                        <span class="pay-option__check"><i class="fa-solid fa-check"></i></span>
                    </label>

                    <label class="pay-option">
                        <input type="radio" name="payment" value="GCash">
                        <span class="pay-option__icon"><i class="fa-solid fa-wallet"></i></span>
                        <span class="pay-option__text">
                            <strong>GCash</strong>
                            <small>Pay via GCash after placing your order</small>
                        </span>
                        <span class="pay-option__check"><i class="fa-solid fa-check"></i></span>
                    </label>

                    <label class="pay-option">
                        <input type="radio" name="payment" value="Card">
                        <span class="pay-option__icon"><i class="fa-solid fa-credit-card"></i></span>
                        <span class="pay-option__text">
                            <strong>Credit / Debit Card</strong>
                            <small>You'll enter card details on the next step</small>
                        </span>
                        <span class="pay-option__check"><i class="fa-solid fa-check"></i></span>
                    </label>

                </div>

            </form>

        </section>

        <!-- ===== Right: order ticket ===== -->
        <aside class="checkout-right">
            <div class="ticket">

                <div class="ticket__head">
                    <span class="ticket__eyebrow">Order summary</span>
                    <span class="ticket__count" id="item-count">0 items</span>
                </div>

                <div id="order-items" class="ticket__items">
                    <!-- items render here -->
                </div>

                <div class="ticket__perf" aria-hidden="true"></div>

                <div class="ticket__totals">
                    <div class="ticket__row">
                        <span>Subtotal</span>
                        <span id="subtotal-price">₱0</span>
                    </div>
                    <div class="ticket__row">
                        <span>Shipping</span>
                        <span>Calculated at fulfillment</span>
                    </div>
                    <div class="ticket__row ticket__row--total">
                        <span>Total</span>
                        <span id="total-price">₱0</span>
                    </div>
                </div>

                <button type="submit" form="checkout-form" id="place-order-btn" class="place-order-btn">
                    <span class="btn-label">Place Order</span>
                    <span class="btn-spinner" aria-hidden="true"></span>
                </button>

                <p class="ticket__note">
                    <i class="fa-solid fa-lock"></i> Your details are only used to fulfill this order.
                </p>

            </div>
        </aside>

    </main>

    <!-- Toast notifications -->
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>

    <script src="js/config.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
