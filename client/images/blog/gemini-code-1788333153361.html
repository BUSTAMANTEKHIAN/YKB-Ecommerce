<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internet Bill Payment Reminder</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .reminder-card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .card-header {
            background: var(--primary);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .card-header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .card-body {
            padding: 1.5rem;
        }

        .bill-details {
            margin-bottom: 1.5rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: var(--text-muted);
        }

        .value {
            font-weight: 500;
            color: var(--text-main);
        }

        .value.amount {
            color: var(--primary);
            font-size: 1.1rem;
            font-weight: 700;
        }

        .value.due-date {
            color: var(--danger);
            font-weight: 600;
        }

        .pay-button {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .pay-button:hover {
            background-color: var(--primary-dark);
        }

        .card-footer {
            text-align: center;
            padding-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="reminder-card">
        <div class="card-header">
            <h1>Internet Bill Due</h1>
            <p>Your monthly subscription is waiting</p>
        </div>
        
        <div class="card-body">
            <div class="bill-details">
                <div class="detail-row">
                    <span class="label">Provider</span>
                    <span class="value">FiberNet Inc.</span>
                </div>
                <div class="detail-row">
                    <span class="label">Account Number</span>
                    <span class="value">#9834-2210-55</span>
                </div>
                <div class="detail-row">
                    <span class="label">Billing Period</span>
                    <span class="value">June 2026</span>
                </div>
                <div class="detail-row">
                    <span class="label">Due Date</span>
                    <span class="value due-date">June 15, 2026</span>
                </div>
                <div class="detail-row">
                    <span class="label">Total Amount</span>
                    <span class="value amount">$49.99</span>
                </div>
            </div>

            <a href="#pay-portal" class="pay-button">Pay Now</a>
            
            <div class="card-footer">
                Please pay on time to avoid service interruption.
            </div>
        </div>
    </div>

</body>
</html>
